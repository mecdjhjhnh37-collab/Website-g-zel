<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#061712">
  <title>Mecd Tools - أدوات وخدمات مجانية</title>

  <meta name="theme-color" content="#061712">
  <meta name="description" content="Mecd Tools - مجموعة أدوات وخدمات مجانية على الإنترنت، سهلة وسريعة للاستخدام.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      color: white;
      background:
        radial-gradient(circle at 50% 0%, #064d37 0%, transparent 38%),
        linear-gradient(180deg, #03110d, #020707);
    }

    .container {
      width: min(92%, 700px);
      margin: auto;
      padding: 55px 0 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 45px;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: rgba(0, 255, 145, 0.12);
      border: 1px solid rgba(0, 255, 145, 0.25);
      box-shadow: 0 0 35px rgba(0, 255, 145, 0.12);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .welcome {
      font-size: 20px;
      color: #a8bdb6;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 18px;
      color: #d9e8e3;
    }

    .service {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 100%;
      padding: 22px;
      margin-bottom: 18px;
      text-decoration: none;
      color: white;
      background: linear-gradient(
        135deg,
        rgba(0, 85, 58, 0.65),
        rgba(2, 31, 24, 0.85)
      );
      border: 1px solid rgba(0, 255, 145, 0.18);
      border-radius: 26px;
      transition: 0.2s ease;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
    }

    .service:active {
      transform: scale(0.98);
    }

    .service-icon {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: rgba(0, 255, 145, 0.12);
      border: 1px solid rgba(0, 255, 145, 0.18);
    }

    .service-info {
      flex: 1;
    }

    .service-name {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .service-description {
      color: #9db1aa;
      font-size: 15px;
      line-height: 1.6;
    }

    .arrow {
      font-size: 28px;
      color: #00e889;
    }

    .footer {
      text-align: center;
      margin-top: 45px;
      color: #62756e;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">

      <div class="logo">🛠️</div>

      <h1>Mecd Tools</h1>

      <p class="welcome">
        أهلاً بك في أدوات Mecd
      </p>

    </header>

    <section>

      <div class="section-title">
        🧰 الخدمات
      </div>

      <a
        class="service"
        href="https://mecdjhjhnh37-collab.github.io/walkie-talkie-telsiz/"
      >

        <div class="service-icon">
          📷
        </div>

        <div class="service-info">

          <div class="service-name">
            Camera Connect
          </div>

          <div class="service-description">
            نظام مراقبة ذكي — استخدم هاتفًا ككاميرا واتصل بجهاز المراقبة.
          </div>

        </div>

        <div class="arrow">
          ←
        </div>

      </a>

    </section>

    <footer class="footer">
      Mecd Tools © 2026
    </footer>

  </main>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Mecd Tools: Service Worker registered"))
      .catch(error => console.error("Service Worker error:", error));
  });
}
</script>
</body>
</html>
