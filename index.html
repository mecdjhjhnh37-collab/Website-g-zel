<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#061712">

<title>Mecd Tools</title>

<meta name="description" content="Mecd Tools - أدوات وخدمات مجانية">

<style>

* {
box-sizing:border-box;
margin:0;
padding:0;
}

body {
font-family:Arial,sans-serif;
min-height:100vh;
color:white;

background:
radial-gradient(circle at 50% 0%, #064d37 0%, transparent 38%),
linear-gradient(180deg,#03110d,#020707);
}


.loading {
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:18px;
}


.loading-logo {
width:80px;
height:80px;
border-radius:25px;

display:flex;
align-items:center;
justify-content:center;

font-size:42px;

background:rgba(0,255,145,.12);
border:1px solid rgba(0,255,145,.25);
}


.spinner {
width:28px;
height:28px;

border:3px solid rgba(255,255,255,.15);
border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;
}


@keyframes spin {
to {transform:rotate(360deg);}
}


.login-page {

min-height:100vh;

display:none;

align-items:center;

justify-content:center;

padding:25px;

}


.login-card {

width:min(100%,420px);

padding:38px 25px;

text-align:center;

border-radius:30px;

background:linear-gradient(
145deg,
rgba(0,85,58,.65),
rgba(2,31,24,.9)
);

border:1px solid rgba(0,255,145,.2);

box-shadow:0 20px 60px rgba(0,0,0,.35);

}


.logo {

width:90px;
height:90px;

margin:0 auto 22px;

border-radius:28px;

display:flex;
align-items:center;
justify-content:center;

font-size:48px;

background:rgba(0,255,145,.12);

border:1px solid rgba(0,255,145,.25);

}


h1 {

font-size:36px;
margin-bottom:12px;

}


.login-text {

color:#a8bdb6;

font-size:17px;

line-height:1.7;

margin-bottom:25px;

}


#loginBtn {

width:100%;

border:none;

border-radius:18px;

padding:16px;

font-size:17px;

font-weight:bold;

cursor:pointer;

background:#00e889;

color:#00150e;

}


.container {

display:none;

width:min(92%,700px);

margin:auto;

padding:55px 0 40px;

}


.header {

text-align:center;

margin-bottom:45px;

}
    .welcome {
    font-size: 20px;
    color: #a8bdb6;
  }

  .section-title {
    font-size: 22px;
    margin-bottom: 18px;
    color: #d9e8e3;
  }

  .service {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    padding: 22px;
    margin-bottom: 18px;
    text-decoration: none;
    color: white;
    background: linear-gradient(
      135deg,
      rgba(0,85,58,.65),
      rgba(2,31,24,.85)
    );
    border: 1px solid rgba(0,255,145,.18);
    border-radius: 26px;
    transition: .2s;
    box-shadow: 0 12px 35px rgba(0,0,0,.25);
  }

  .service:active {
    transform: scale(.98);
  }

  .service-icon {
    width: 70px;
    height: 70px;
    flex-shrink: 0;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    background: rgba(0,255,145,.12);
    border: 1px solid rgba(0,255,145,.18);
  }

  .service-info {
    flex: 1;
  }

  .service-name {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .service-description {
    color: #9db1aa;
    font-size: 15px;
    line-height: 1.6;
  }

  .arrow {
    font-size: 28px;
    color: #00e889;
  }

  .footer {
    text-align: center;
    margin-top: 45px;
    color: #62756e;
    font-size: 13px;
  }

</style>
</head>

<body>

<div id="loadingPage" class="loading">
  <div class="loading-logo">🛠️</div>
  <div class="spinner"></div>
</div>


<div id="loginPage" class="login-page">

  <div class="login-card">

    <div class="logo">🛠️</div>

    <h1>Mecd Tools</h1>

    <p class="login-text">
      أهلاً بك 👋<br>
      سجّل الدخول للمتابعة إلى خدمات Mecd Tools
    </p>

    <button id="loginBtn">
      🔵 تسجيل الدخول بواسطة Google
    </button>

    <div id="errorMessage" class="error"></div>

  </div>

</div>


<main id="mainPage" class="container">

  <header class="header">

    <div class="logo">🛠️</div>

    <h1>Mecd Tools</h1>

    <p class="welcome">
      أهلاً بك في أدوات Mecd
    </p>

  </header>


  <section>

    <div class="section-title">
      🧰 الخدمات
    </div>


    <!-- Camera Connect -->

    <a
      class="service"
      href="https://mecdjhjhnh37-collab.github.io/walkie-talkie-telsiz/"
    >

      <div class="service-icon">
        📷
      </div>

      <div class="service-info">

        <div class="service-name">
          Camera Connect
        </div>

        <div class="service-description">
          نظام مراقبة ذكي — استخدم هاتفًا ككاميرا واتصل بجهاز المراقبة.
        </div>

      </div>

      <div class="arrow">
        ←
      </div>

    </a>


    <!-- Mecd Chat -->

    <a
      class="service"
      href="https://mecdjhjhnh37-collab.github.io/MecdChat/"
    >

      <div class="service-icon">
        💬
      </div>

      <div class="service-info">

        <div class="service-name">
          Mecd Chat
        </div>

        <div class="service-description">
          دردشة وغرف خاصة بين المستخدمين.
        </div>

      </div>

      <div class="arrow">
        ←
      </div>

    </a>

  </section>


  <footer class="footer">
    Mecd Tools © 2026
  </footer>

</main>


<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
}
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

  authDomain: "mecd-tools.firebaseapp.com",

  projectId: "mecd-tools",

  storageBucket: "mecd-tools.firebasestorage.app",

  messagingSenderId: "643005547408",

  appId: "1:643005547408:web:b1719060ec340dd0e0a915",

  measurementId: "G-0VKYR3TQV2"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


const loadingPage =
  document.getElementById("loadingPage");

const loginPage =
  document.getElementById("loginPage");

const mainPage =
  document.getElementById("mainPage");

const loginBtn =
  document.getElementById("loginBtn");

const errorMessage =
  document.getElementById("errorMessage");


await setPersistence(
  auth,
  browserLocalPersistence
);


onAuthStateChanged(auth, (user) => {

  loadingPage.style.display = "none";

  if (user) {

    loginPage.style.display = "none";

    mainPage.style.display = "block";

  } else {

    mainPage.style.display = "none";

    loginPage.style.display = "flex";

  }

});


loginBtn.addEventListener("click", async () => {

  loginBtn.disabled = true;

  loginBtn.textContent =
    "جاري تسجيل الدخول...";

  errorMessage.style.display = "none";


  try {

    const result = await signInWithPopup(
  auth,
  provider
);


const user = result.user;


localStorage.setItem(
  "mecdUser",
  JSON.stringify({
    name: user.displayName,
    photo: user.photoURL,
    email: user.email
  })
);


  } catch (error) {

    console.error(error);

    errorMessage.textContent =
      "حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.";

    errorMessage.style.display = "block";

    loginBtn.disabled = false;

    loginBtn.textContent =
      "🔵 تسجيل الدخول بواسطة Google";

  }

});

</script>


<script>

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker.register("./sw.js")

      .then(() => {

        console.log(
          "Mecd Tools: Service Worker registered"
        );

      })

      .catch(error => {

        console.error(
          "Service Worker error:",
          error
        );

      });

  });

}

</script>


</body>

</html>
