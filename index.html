<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#061712">

<title>Mecd Tools</title>

<meta name="description" content="Mecd Tools - أدوات وخدمات مجانية">

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  color: white;

  background:
    radial-gradient(circle at 50% 0%, #064d37 0%, transparent 38%),
    linear-gradient(180deg, #03110d, #020707);
}


/* =========================
   Loading
========================= */

.loading {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
}

.loading-logo {
  width: 80px;
  height: 80px;
  border-radius: 25px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 42px;

  background: rgba(0,255,145,.12);
  border: 1px solid rgba(0,255,145,.25);
}

.spinner {
  width: 28px;
  height: 28px;

  border: 3px solid rgba(255,255,255,.15);
  border-top-color: #00e889;

  border-radius: 50%;

  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


/* =========================
   Login
========================= */

.login-page {
  min-height: 100vh;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 25px;
}

.login-card {
  width: min(100%, 420px);

  padding: 38px 25px;

  text-align: center;

  border-radius: 30px;

  background:
    linear-gradient(
      145deg,
      rgba(0,85,58,.65),
      rgba(2,31,24,.9)
    );

  border: 1px solid rgba(0,255,145,.2);

  box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.logo {
  width: 90px;
  height: 90px;

  margin: 0 auto 22px;

  border-radius: 28px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 48px;

  background: rgba(0,255,145,.12);

  border: 1px solid rgba(0,255,145,.25);
}

h1 {
  font-size: 36px;
  margin-bottom: 12px;
}

.login-text {
  color: #a8bdb6;

  font-size: 17px;

  line-height: 1.7;

  margin-bottom: 25px;
}

#loginBtn {
  width: 100%;

  border: none;

  border-radius: 18px;

  padding: 16px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

  background: #00e889;

  color: #00150e;
}

#loginBtn:active {
  transform: scale(.97);
}

#loginBtn:disabled {
  opacity: .6;
}

.error {
  color: #ff8f8f;

  font-size: 14px;

  margin-top: 15px;

  display: none;
}


/* =========================
   Main
========================= */

.container {
  display: none;

  width: min(92%, 700px);

  margin: auto;

  padding: 25px 0 40px;
}


/* =========================
   Account
========================= */

.account-area {
  position: relative;

  display: flex;

  justify-content: flex-start;

  margin-bottom: 25px;
}

.account-button {
  display: flex;

  align-items: center;

  gap: 10px;

  padding: 7px 10px;

  border-radius: 18px;

  border: 1px solid rgba(0,255,145,.2);

  background: rgba(0,60,40,.55);

  color: white;

  cursor: pointer;
}

.account-button:active {
  transform: scale(.97);
}

.account-photo {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  object-fit: cover;

  border: 2px solid #00e889;
}

.account-name {
  max-width: 150px;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  font-size: 15px;

  font-weight: bold;
}

.account-arrow {
  color: #00e889;

  font-size: 14px;
}


/* القائمة */

.account-menu {
  position: absolute;

  top: 58px;

  right: 0;

  width: 210px;

  padding: 10px;

  border-radius: 18px;

  background:
    linear-gradient(
      145deg,
      rgba(0,60,40,.98),
      rgba(2,25,20,.98)
    );

  border: 1px solid rgba(0,255,145,.2);

  box-shadow: 0 15px 40px rgba(0,0,0,.4);

  display: none;

  z-index: 100;
}

.account-menu.show {
  display: block;
}

.account-email {
  padding: 10px;

  color: #9db1aa;

  font-size: 13px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  border-bottom: 1px solid rgba(255,255,255,.08);

  margin-bottom: 8px;
}

.logout-button {
  width: 100%;

  padding: 12px;

  border: none;

  border-radius: 12px;

  background: rgba(255,70,70,.12);

  color: #ff9b9b;

  font-size: 15px;

  font-weight: bold;

  cursor: pointer;
}

.logout-button:active {
  transform: scale(.97);
}


/* =========================
   Header
========================= */

.header {
  text-align: center;

  margin-bottom: 45px;
}

.welcome {
  font-size: 20px;

  color: #a8bdb6;
}

.section-title {
  font-size: 22px;

  margin-bottom: 18px;

  color: #d9e8e3;
}


/* =========================
   Services
========================= */

.service {
  display: flex;

  align-items: center;

  gap: 18px;

  width: 100%;

  padding: 22px;

  margin-bottom: 18px;

  text-decoration: none;

  color: white;

  background:
    linear-gradient(
      135deg,
      rgba(0,85,58,.65),
      rgba(2,31,24,.85)
    );

  border: 1px solid rgba(0,255,145,.18);

  border-radius: 26px;

  transition: .2s;

  box-shadow: 0 12px 35px rgba(0,0,0,.25);
}

.service:active {
  transform: scale(.98);
}

.service-icon {
  width: 70px;
  height: 70px;

  flex-shrink: 0;

  border-radius: 22px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 38px;

  background: rgba(0,255,145,.12);

  border: 1px solid rgba(0,255,145,.18);
}

.service-info {
  flex: 1;
}

.service-name {
  font-size: 22px;

  font-weight: bold;

  margin-bottom: 8px;
}

.service-description {
  color: #9db1aa;

  font-size: 15px;

  line-height: 1.6;
}

.arrow {
  font-size: 28px;

  color: #00e889;
}


/* =========================
   Footer
========================= */

.footer {
  text-align: center;

  margin-top: 45px;

  color: #62756e;

  font-size: 13px;
}

</style>

</head>


<body>


<!-- Loading -->

<div id="loadingPage" class="loading">

  <div class="loading-logo">
    🛠️
  </div>

  <div class="spinner"></div>

</div>


<!-- Login -->

<div id="loginPage" class="login-page">

  <div class="login-card">

    <div class="logo">
      🛠️
    </div>

    <h1>
      Mecd Tools
    </h1>

    <p class="login-text">
      أهلاً بك 👋<br>
      سجّل الدخول للمتابعة إلى خدمات Mecd Tools
    </p>

    <button id="loginBtn">
      🔵 تسجيل الدخول بواسطة Google
    </button>

    <div id="errorMessage" class="error"></div>

  </div>

</div>


<!-- Main -->

<main id="mainPage" class="container">


  <!-- Account -->

  <div class="account-area">

    <button
      id="accountButton"
      class="account-button"
    >

      <img
        id="accountPhoto"
        class="account-photo"
        src=""
        alt="الحساب"
      >

      <span
        id="accountName"
        class="account-name"
      >
        الحساب
      </span>

      <span class="account-arrow">
        ▼
      </span>

    </button>


    <!-- Account Menu -->

    <div
      id="accountMenu"
      class="account-menu"
    >

      <div
        id="accountEmail"
        class="account-email"
      >
      </div>

      <button
        id="logoutBtn"
        class="logout-button"
      >
        تسجيل الخروج
      </button>

    </div>

  </div>


  <!-- Header -->

  <header class="header">

    <div class="logo">
      🛠️
    </div>

    <h1>
      Mecd Tools
    </h1>

    <p class="welcome">
      أهلاً بك في أدوات Mecd
    </p>

  </header>


  <!-- Services -->

  <section>

    <div class="section-title">
      🧰 الخدمات
    </div>


    <!-- Camera Connect -->

    <a
      class="service"
      href="https://mecdjhjhnh37-collab.github.io/walkie-talkie-telsiz/"
    >

      <div class="service-icon">
        📷
      </div>

      <div class="service-info">

        <div class="service-name">
          Camera Connect
        </div>

        <div class="service-description">
          نظام مراقبة ذكي — استخدم هاتفًا ككاميرا واتصل بجهاز المراقبة.
        </div>

      </div>

      <div class="arrow">
        ←
      </div>

    </a>


    <!-- Mecd Chat -->

    <a
      class="service"
      href="https://mecdjhjhnh37-collab.github.io/MecdChat/"
    >

      <div class="service-icon">
        💬
      </div>

      <div class="service-info">

        <div class="service-name">
          Mecd Chat
        </div>

        <div class="service-description">
          دردشة وغرف خاصة بين المستخدمين.
        </div>

      </div>

      <div class="arrow">
        ←
      </div>

    </a>

  </section>


  <footer class="footer">
    Mecd Tools © 2026
  </footer>


</main>


<!-- Firebase -->

<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

  getAuth,

  GoogleAuthProvider,

  signInWithPopup,

  onAuthStateChanged,

  setPersistence,

  browserLocalPersistence,

  signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* Firebase Config */

const firebaseConfig = {

  apiKey:
    "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

  authDomain:
    "mecd-tools.firebaseapp.com",

  projectId:
    "mecd-tools",

  storageBucket:
    "mecd-tools.firebasestorage.app",

  messagingSenderId:
    "643005547408",

  appId:
    "1:643005547408:web:b1719060ec340dd0e0a915",

  measurementId:
    "G-0VKYR3TQV2"

};


/* Firebase */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const provider =
  new GoogleAuthProvider();


/* Elements */

const loadingPage =
  document.getElementById("loadingPage");

const loginPage =
  document.getElementById("loginPage");

const mainPage =
  document.getElementById("mainPage");

const loginBtn =
  document.getElementById("loginBtn");

const errorMessage =
  document.getElementById("errorMessage");

const accountButton =
  document.getElementById("accountButton");

const accountMenu =
  document.getElementById("accountMenu");

const accountPhoto =
  document.getElementById("accountPhoto");

const accountName =
  document.getElementById("accountName");

const accountEmail =
  document.getElementById("accountEmail");

const logoutBtn =
  document.getElementById("logoutBtn");


/* Persistence */

await setPersistence(
  auth,
  browserLocalPersistence
);


/* Save user */

function saveUser(user) {

  localStorage.setItem(
    "mecdUser",

    JSON.stringify({

      name:
        user.displayName || "مستخدم",

      photo:
        user.photoURL || "",

      email:
        user.email || ""

    })

  );

}


/* Show account */

function showAccount(user) {

  accountName.textContent =
    user.displayName || "مستخدم";

  accountEmail.textContent =
    user.email || "";

  accountPhoto.src =
    user.photoURL ||
    "https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg";

}


/* Authentication */

onAuthStateChanged(
  auth,
  (user) => {

    loadingPage.style.display =
      "none";


    if (user) {

      /* حفظ الحساب */

      saveUser(user);


      /* عرض الحساب */

      showAccount(user);


      /* إظهار الصفحة */

      loginPage.style.display =
        "none";

      mainPage.style.display =
        "block";

    }

    else {

      /* حذف الحساب المحفوظ */

      localStorage.removeItem(
        "mecdUser"
      );


      /* إظهار تسجيل الدخول */

      mainPage.style.display =
        "none";

      loginPage.style.display =
        "flex";

    }

  }
);


/* Google Login */

loginBtn.addEventListener(
  "click",

  async () => {

    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "جاري تسجيل الدخول...";

    errorMessage.style.display =
      "none";


    try {

      const result =
        await signInWithPopup(
          auth,
          provider
        );


      /* حفظ بيانات الحساب */

      saveUser(result.user);


    }

    catch (error) {

      console.error(error);

      errorMessage.textContent =
        "حدث خطأ أثناء تسجيل الدخول. حاول مرة أخرى.";

      errorMessage.style.display =
        "block";

      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "🔵 تسجيل الدخول بواسطة Google";

    }

  }
);


/* Account menu */

accountButton.addEventListener(
  "click",

  (event) => {

    event.stopPropagation();

    accountMenu.classList.toggle(
      "show"
    );

  }
);


/* Close menu */

document.addEventListener(
  "click",

  () => {

    accountMenu.classList.remove(
      "show"
    );

  }
);


/* Logout */

logoutBtn.addEventListener(
  "click",

  async (event) => {

    event.stopPropagation();


    try {

      await signOut(auth);


      localStorage.removeItem(
        "mecdUser"
      );


      accountMenu.classList.remove(
        "show"
      );

    }

    catch (error) {

      console.error(error);

      alert(
        "حدث خطأ أثناء تسجيل الخروج."
      );

    }

  }
);


</script>


<!-- Service Worker -->

<script>

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",

    () => {

      navigator.serviceWorker
        .register("./sw.js")

        .then(() => {

          console.log(
            "Mecd Tools: Service Worker registered"
          );

        })

        .catch(
          error => {

            console.error(
              "Service Worker error:",
              error
            );

          }
        );

    }
  );

}

</script>


</body>

</html>
