<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#061712">

<title>Mecd Tools - أدوات وخدمات مجانية</title>

<meta name="description" content="Mecd Tools - مجموعة أدوات وخدمات مجانية على الإنترنت">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:white;
background:
radial-gradient(circle at 50% 0%, #064d37 0%, transparent 38%),
linear-gradient(180deg,#03110d,#020707);
}


.container{
width:min(92%,700px);
margin:auto;
padding:55px 0;
}


.center{
text-align:center;
}


.logo{
width:100px;
height:100px;
margin:auto auto 20px;
border-radius:30px;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
background:rgba(0,255,145,.12);
border:1px solid rgba(0,255,145,.3);
}


h1{
font-size:38px;
margin-bottom:15px;
}


p{
color:#a8bdb6;
font-size:18px;
}


.login-box{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}


.login-card{
width:min(90%,400px);
padding:35px;
border-radius:30px;
background:rgba(0,60,40,.5);
border:1px solid rgba(0,255,145,.2);
text-align:center;
}


.google-btn{
margin-top:25px;
width:100%;
padding:16px;
border:none;
border-radius:18px;
font-size:18px;
cursor:pointer;
background:#00e889;
color:#00150e;
font-weight:bold;
}


.service{
display:flex;
align-items:center;
gap:18px;
padding:22px;
margin-top:20px;
border-radius:25px;
text-decoration:none;
color:white;
background:linear-gradient(135deg,#00553a,#021f18);
}


.service-icon{
font-size:40px;
}


.service-name{
font-size:22px;
font-weight:bold;
}


.loading{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

</style>

</head>
